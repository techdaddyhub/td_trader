name: TD TRADER - Continuous Integration (CI)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Test Suite & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r td_trader/requirements.txt

      - name: Execute Master Unit & Integration Tests
        run: |
          python -m unittest td_trader/infrastructure/tests/test_master_suite.py

  frontend-check:
    name: Flutter Frontend Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: td_trader/frontend
        run: flutter pub get

      - name: Analyze Flutter Code
        working-directory: td_trader/frontend
        run: flutter analyze --no-fatal-infos
