name: TD TRADER - Continuous Integration (CI)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Test Suite & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r td_trader/requirements.txt

      - name: Execute Master Unit & Integration Tests
        env:
          PYTHONPATH: .
        run: |
          python -m unittest td_trader/infrastructure/tests/test_master_suite.py

  frontend-check:
    name: Flutter Frontend Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Platform Scaffolding
        working-directory: td_trader/frontend
        run: |
          cp -r lib lib_backup
          cp pubspec.yaml pubspec.yaml.orig
          flutter create --project-name td_trader --org com.techdaddy --platforms=android,web,linux,windows,macos .
          rm -rf lib
          mv lib_backup lib
          cp pubspec.yaml.orig pubspec.yaml
          mkdir -p assets/images assets/audio
          touch assets/images/.gitkeep assets/audio/.gitkeep
          flutter pub get

      - name: Analyze Flutter Code
        working-directory: td_trader/frontend
        run: flutter analyze --no-fatal-infos || true
