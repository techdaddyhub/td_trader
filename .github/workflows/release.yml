name: TD TRADER - Multi-Platform Build & Automated Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v2.0.0)'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write
  packages: write
  pages: write

jobs:
  # ==========================================
  # 1. BUILD ANDROID APK
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Platform Scaffolding
        working-directory: td_trader/frontend
        run: |
          cp -r lib lib_backup
          cp pubspec.yaml pubspec.yaml.orig
          flutter create --project-name td_trader --org com.techdaddy --platforms=android .
          rm -rf lib
          mv lib_backup lib
          cp pubspec.yaml.orig pubspec.yaml
          mkdir -p assets/images assets/audio
          touch assets/images/.gitkeep assets/audio/.gitkeep
          if [ -f "desktop_res/apply_desktop_branding.py" ]; then
            python3 desktop_res/apply_desktop_branding.py android
          fi
          flutter pub get

      - name: Build Android Release APK
        working-directory: td_trader/frontend
        run: flutter build apk --release

      - name: Package Android Artifact
        run: |
          mkdir -p artifacts
          APK_FILE=$(find td_trader/frontend/build -name "*release*.apk" 2>/dev/null | head -n 1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" artifacts/TDTrader-Android.apk
          else
            echo "ERROR: APK not found"
            exit 1
          fi

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: artifacts/TDTrader-Android.apk

  # ==========================================
  # 2. BUILD WEB APPLICATION (SPA)
  # ==========================================
  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Platform Scaffolding
        working-directory: td_trader/frontend
        run: |
          cp -r lib lib_backup
          cp pubspec.yaml pubspec.yaml.orig
          flutter create --project-name td_trader --org com.techdaddy --platforms=web .
          rm -rf lib
          mv lib_backup lib
          cp pubspec.yaml.orig pubspec.yaml
          mkdir -p assets/images assets/audio
          touch assets/images/.gitkeep assets/audio/.gitkeep
          if [ -f "desktop_res/apply_desktop_branding.py" ]; then
            python3 desktop_res/apply_desktop_branding.py web
          fi
          flutter pub get

      - name: Build Web Release
        working-directory: td_trader/frontend
        run: flutter build web --release

      - name: Package Web App Zip
        run: |
          mkdir -p artifacts
          cd td_trader/frontend/build/web
          zip -r ../../../../artifacts/TDTrader-Web-App.zip .

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: artifacts/TDTrader-Web-App.zip

  # ==========================================
  # 3. BUILD LINUX DESKTOP APP
  # ==========================================
  build-linux:
    name: Build Linux Desktop Bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=20 -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=20 -o Acquire::Retries=3 install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop Support
        run: flutter config --enable-linux-desktop

      - name: Prepare Platform Scaffolding
        working-directory: td_trader/frontend
        run: |
          cp -r lib lib_backup
          cp pubspec.yaml pubspec.yaml.orig
          flutter create --project-name td_trader --org com.techdaddy --platforms=linux .
          rm -rf lib
          mv lib_backup lib
          cp pubspec.yaml.orig pubspec.yaml
          mkdir -p assets/images assets/audio
          touch assets/images/.gitkeep assets/audio/.gitkeep
          if [ -f "desktop_res/apply_desktop_branding.py" ]; then
            python3 desktop_res/apply_desktop_branding.py linux
          fi
          flutter pub get

      - name: Build Linux Desktop Release
        working-directory: td_trader/frontend
        run: flutter build linux --release

      - name: Package Linux Binary Archive
        run: |
          mkdir -p artifacts
          if [ -d "td_trader/frontend/desktop_res/linux" ]; then
            cp td_trader/frontend/desktop_res/linux/td_trader.png td_trader/frontend/build/linux/x64/release/bundle/
            cp td_trader/frontend/desktop_res/linux/TD_TRADER.desktop td_trader/frontend/build/linux/x64/release/bundle/
          fi
          tar -czvf artifacts/TDTrader-Linux-x64.tar.gz -C td_trader/frontend/build/linux/x64/release/bundle .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: artifacts/TDTrader-Linux-x64.tar.gz

  # ==========================================
  # 4. BUILD WINDOWS DESKTOP APP
  # ==========================================
  build-windows:
    name: Build Windows Desktop App
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Prepare Platform Scaffolding
        shell: bash
        working-directory: td_trader/frontend
        run: |
          cp -r lib lib_backup
          cp pubspec.yaml pubspec.yaml.orig
          flutter create --project-name td_trader --org com.techdaddy --platforms=windows .
          rm -rf lib
          mv lib_backup lib
          cp pubspec.yaml.orig pubspec.yaml
          mkdir -p assets/images assets/audio
          touch assets/images/.gitkeep assets/audio/.gitkeep
          if [ -f "desktop_res/apply_desktop_branding.py" ]; then
            python3 desktop_res/apply_desktop_branding.py windows || python desktop_res/apply_desktop_branding.py windows
          fi
          flutter pub get

      - name: Build Windows Desktop Release
        working-directory: td_trader/frontend
        run: flutter build windows --release

      - name: Compress Windows Distribution
        run: |
          mkdir -p artifacts
          Compress-Archive -Path td_trader/frontend/build/windows/x64/runner/Release/* -DestinationPath artifacts/TDTrader-Windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: artifacts/TDTrader-Windows-x64.zip

  # ==========================================
  # 5. BUILD MACOS DESKTOP APP
  # ==========================================
  build-macos:
    name: Build macOS Desktop App
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop Support
        run: flutter config --enable-macos-desktop

      - name: Prepare Platform Scaffolding
        working-directory: td_trader/frontend
        run: |
          cp -r lib lib_backup
          cp pubspec.yaml pubspec.yaml.orig
          flutter create --project-name td_trader --org com.techdaddy --platforms=macos .
          rm -rf lib
          mv lib_backup lib
          cp pubspec.yaml.orig pubspec.yaml
          mkdir -p assets/images assets/audio
          touch assets/images/.gitkeep assets/audio/.gitkeep
          if [ -f "desktop_res/apply_desktop_branding.py" ]; then
            python3 desktop_res/apply_desktop_branding.py macos
          fi
          flutter pub get

      - name: Build macOS Release App
        working-directory: td_trader/frontend
        run: flutter build macos --release

      - name: Package macOS Zip Archive
        run: |
          mkdir -p artifacts
          APP_PATH=$(find td_trader/frontend/build/macos -name "*.app" 2>/dev/null | head -n 1)
          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            cd "$(dirname "$APP_PATH")"
            zip -r "$GITHUB_WORKSPACE/artifacts/TDTrader-macOS.zip" "$(basename "$APP_PATH")"
          else
            echo "ERROR: macOS .app bundle not found"
            find td_trader/frontend/build -maxdepth 5 || true
            exit 1
          fi

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: artifacts/TDTrader-macOS.zip

  # ==========================================
  # 6. AGGREGATE ARTIFACTS & CREATE GITHUB RELEASE
  # ==========================================
  create-release:
    name: Publish Official GitHub Release
    if: always() && !cancelled()
    needs: [build-android, build-web, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Release Assets Directory
        run: mkdir -p release_assets

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-release
          path: release_assets
          merge-multiple: true

      - name: Download Web Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: web-release
          path: release_assets
          merge-multiple: true

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: linux-release
          path: release_assets
          merge-multiple: true

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: windows-release
          path: release_assets
          merge-multiple: true

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: macos-release
          path: release_assets
          merge-multiple: true

      - name: Copy MetaTrader Expert Advisors & User Guide
        run: |
          cp td_trader/metatrader_bridge/experts/TDTrader_Bridge_MT4.mq4 release_assets/
          cp td_trader/metatrader_bridge/experts/TDTrader_Bridge_MT5.mq5 release_assets/
          if [ -f "docs/TD_TRADER_USER_MANUAL_AND_BUYERS_GUIDE_2026.pdf" ]; then
            cp docs/TD_TRADER_USER_MANUAL_AND_BUYERS_GUIDE_2026.pdf release_assets/
          fi
          if [ -f "td_trader/frontend/assets/images/app_icon.png" ]; then
            cp td_trader/frontend/assets/images/app_icon.png release_assets/
          fi

      - name: Flatten Directory Structure
        run: |
          find release_assets/ -mindepth 2 -type f -exec mv -t release_assets/ {} + || true
          find release_assets/ -empty -type d -delete || true
          ls -la release_assets/

      - name: Generate SHA-256 Checksums
        run: |
          cd release_assets
          sha256sum * > SHA256SUMS.txt || true
          cat SHA256SUMS.txt || true

      - name: Determine Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          elif [ -n "${GITHUB_REF}" ] && [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v2.0.0" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release with Downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "TD TRADER Release ${{ steps.vars.outputs.tag }}"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## TD TRADER – Advanced AI Trading Ecosystem
            **Tagline:** *Trade Smarter. Think Faster. Let AI Explain.*
            **Owner:** TechDaddy | **Copyright:** © 2026 TechDaddy. All rights reserved.

            Official multi-platform release containing compiled applications, Web SPA, and MetaTrader 4/5 zero-latency Expert Advisors.

            ### 📚 Official Documentation & Buyer's Guide
            * 📖 **Complete User Manual & Setup Guide (PDF):** [Download `TD_TRADER_USER_MANUAL_AND_BUYERS_GUIDE_2026.pdf`](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/TD_TRADER_USER_MANUAL_AND_BUYERS_GUIDE_2026.pdf) (Includes Android setup, MT4/MT5 connection steps, and tool walkthroughs)
            * 🎨 **Official TD Binance-Gold App Icon:** [Download `app_icon.png`](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/app_icon.png)

            ### 🚀 Direct App Downloads
            * 📱 **Android App (APK):** [Download `TDTrader-Android.apk`](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/TDTrader-Android.apk) (Android 8.0+)
            * 🌐 **Web Application (SPA):** [Download `TDTrader-Web-App.zip`](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/TDTrader-Web-App.zip) (Deploy to any web server or run locally)
            * 💻 **Windows Desktop (x64):** [Download `TDTrader-Windows-x64.zip`](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/TDTrader-Windows-x64.zip) (Portable Windows 64-bit App)
            * 🐧 **Linux Desktop (x64):** [Download `TDTrader-Linux-x64.tar.gz`](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/TDTrader-Linux-x64.tar.gz) (Linux x86_64 desktop bundle)
            * 🍎 **macOS Desktop:** [Download `TDTrader-macOS.zip`](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/TDTrader-macOS.zip) (macOS app bundle)

            ### ⚡ MetaTrader 4 & 5 Bridge Connectors
            * [Download `TDTrader_Bridge_MT4.mq4`](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/TDTrader_Bridge_MT4.mq4)
            * [Download `TDTrader_Bridge_MT5.mq5`](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/TDTrader_Bridge_MT5.mq5)

            ### 🔒 Integrity Checksums (SHA-256)
            Download [`SHA256SUMS.txt`](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/SHA256SUMS.txt) to verify file integrity.

            ---
            *TD TRADER is proprietary intellectual property owned and developed by TechDaddy.*
          files: |
            release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
