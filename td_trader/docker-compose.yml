version: '3.8'

services:
  td-trader-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: td_trader_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "5555:5555" # MT4 Bridge
      - "5556:5556" # MT5 Bridge
    environment:
      - TD_SECRET_KEY=td-trader-production-docker-secret-key-32-chars-min!
      - DATABASE_URL=sqlite:///./td_trader_database.sqlite
      - MARKET_DATA_PROVIDER=hybrid_realtime
    volumes:
      - td_data:/app/data

volumes:
  td_data:

